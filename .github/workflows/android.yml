name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build installable APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PbuildNumber=${{ github.run_number }}
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Urokche.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Urokche-APK
          path: Urokche.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish test APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: УчаСе · Урокче 0.2.${{ github.run_number }} (тестова версия)
          prerelease: true
          files: Urokche.apk
          fail_on_unmatched_files: true
          body: |
            Детска библиотека специално за предоставения торент УчаСе. Android 7.0+, телефон, таблет и Android TV.

            Изтегли Urokche.apk от Assets. Избери своя клас, предмет и урок.
            Цветни карти, весела совичка, продължаване на урока и звездички за изгледаните уроци.
            Изтегля се избраното видео и нужните гранични части. Кешът се изчиства след затваряне.
            Нужни са достъпни сийдъри. Поддържаните кодеци зависят от устройството.

            Автоматичните тестове и Android lint са успешни. Нужен е тест на физическите устройства.
            Това е debug APK за първоначално тестване; постоянно release подписване предстои.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
