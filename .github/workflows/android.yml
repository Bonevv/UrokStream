name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build installable APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PbuildNumber=${{ github.run_number }}
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UrokStream.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UrokStream-APK
          path: UrokStream.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
